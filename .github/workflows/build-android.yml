name: Build and Deploy Android

on:
  push:
    branches: [ 'release/**' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Decode keystore
        run: |
          mkdir -p android/credentials
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/credentials/keystore.jks

      - name: Fix gradlew
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Parse version from branch
        id: version
        run: |
          BRANCH="${GITHUB_REF#refs/heads/release/}"
          echo "versionName=$BRANCH" >> $GITHUB_OUTPUT
          echo "versionCode=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build release AAB
        run: cd android && ./gradlew bundleRelease -PversionName=${{ steps.version.outputs.versionName }} -PversionCode=${{ steps.version.outputs.versionCode }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.versionName }}
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Decode service account
        run: |
          echo "${{ secrets.SERVICE_ACCOUNT_JSON }}" | base64 -d > android/service-account.json

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: android/service-account.json
          packageName: com.ptimsina.billsplitter
          releaseFile: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: ${{ steps.version.outputs.versionName }}
